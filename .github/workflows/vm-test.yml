name: VM Smoke Test

on:
  pull_request:
    paths:
      - 'src/**'
      - 'nix/**'
      - 'scripts/**'
      - 'flake.nix'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual triggering

jobs:
  vm-test:
    runs-on: [self-hosted, linux, x86_64]
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup test output directory
        run: |
          mkdir -p /tmp/shade-test-output
          mkdir -p test-output
          mkdir -p test-output/screenshots

      - name: Run VM smoke test
        run: |
          nix develop -c bash -c '
            set -euo pipefail
            echo "Starting VM..."
            nix run .#nixosConfigurations.vm-vnc.config.system.build.vm &
            VM_PID=$!
            sleep 3

            echo "Running smoke test..."
            SHADE_TEST_OUTPUT=test-output/screenshots \
            python3 scripts/agent-smoke-test.py
            TEST_EXIT=$?

            echo "Stopping VM..."
            kill $VM_PID 2>/dev/null || true
            wait $VM_PID 2>/dev/null || true

            exit $TEST_EXIT
          '
        timeout-minutes: 12

      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: test-output/
          retention-days: 7

      - name: Upload golden images (first run)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-images
          path: test-output/
          retention-days: 30
