name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: shade-shell
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: true

      - name: Build package
        run: nix build -L

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        run: nix shell nixpkgs#pnpm -c pnpm --version

      - name: Install Node deps
        run: nix shell nixpkgs#pnpm -c pnpm install --frozen-lockfile

      - name: Lint
        run: nix shell nixpkgs#pnpm -c pnpm run lint

      - name: Syntax check
        run: nix shell nixpkgs#pnpm -c pnpm run syntax

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: shade-shell
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: true

      - name: Run GJS unit tests
        run: nix develop -c sh -c 'gjs -m src/lib/__tests__/hypridle.test.ts'
